spring.application.name=envios-express-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Manten conexiones "calientes" contra Neon para evitar la latencia de reconexion
# en la primera peticion tras un periodo de inactividad (RNF-01: respuesta < 3s)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

app.google.client-id=${GOOGLE_CLIENT_ID:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Solo se expone "health" (RNF-02); el resto de Actuator queda deshabilitado
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
