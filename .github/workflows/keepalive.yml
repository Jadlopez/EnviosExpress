name: Keep Render Awake

on:
  schedule:
    # Cada 10 minutos
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render
        run: |
          curl -L --silent --fail \
          https://enviosexpress.onrender.com/actuator/health
